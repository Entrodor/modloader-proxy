name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]   # fires when you publish a release in the GitHub UI
  workflow_dispatch:

permissions:
  contents: write        # needed to upload assets to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross compilers
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Build (x64 + x86)
        run: make all

      - name: Package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG:-dev-${GITHUB_SHA::7}}"
          mkdir -p dist
          for arch in x64 x86; do
            d="dist/modloader-proxy-$VERSION-$arch"
            mkdir -p "$d"
            cp build/$arch/modloader-proxy.dll build/gen/supported_dlls.txt \
               chainloader.ini README.md LICENSE "$d/"
            (cd dist && zip -r "modloader-proxy-$VERSION-$arch.zip" "modloader-proxy-$VERSION-$arch")
          done

      # Every run: downloadable from the run's page (handy for testing before a release)
      - uses: actions/upload-artifact@v4
        with:
          name: modloader-proxy
          path: dist/*.zip

      # Release runs only: attach the zips to the release that triggered this
      - name: Upload assets to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
