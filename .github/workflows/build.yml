name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross compilers
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Build (x64 + x86)
        run: make all

      - name: Package
        run: |
          mkdir -p dist
          for arch in x64 x86; do
            d=dist/modloader-proxy-$arch
            mkdir -p "$d"
            cp build/$arch/modloader-proxy.dll build/gen/supported_dlls.txt chainloader.ini README.md LICENSE "$d/"
            (cd dist && zip -r "modloader-proxy-$arch.zip" "modloader-proxy-$arch")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: modloader-proxy
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
