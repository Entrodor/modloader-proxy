; modloader-proxy configuration. Place next to the renamed proxy DLL.

[Settings]
; Write modloader-proxy.log next to the DLL (useful when something doesn't load)
Log = true
; false = load mods immediately inside DllMain (earliest, what most mods expect)
; true  = load from a separate thread right after the game starts the DLL
Deferred = false
; Only used when Deferred = true
DelayMs = 0

[Load]
; One DLL per line. Relative paths are relative to this file. ';' starts a comment.
; mods\ExampleMod.dll
; AnotherMod.dll
