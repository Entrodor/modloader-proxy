; modloader-proxy configuration. Place next to the renamed proxy DLL.

[Settings]
; Write modloader-proxy.log next to the DLL (useful when something doesn't load)
Log = true
; false = load mods immediately inside DllMain (earliest, what most mods expect)
; true  = load from a separate thread right after the game starts the DLL
Deferred = false
; Only used when Deferred = true. Some mods need the game to finish starting first.
DelayMs = 0

; Load every *.dll found in a folder (not recursive, alphabetical order).
; Relative to this file. Must be a subfolder. Put mod dependencies in a
; sub-subfolder so they aren't loaded as mods themselves.
LoadFromFolder = false
ModsFolder = mods

[Load]
; Explicit entries, loaded first, in this order. One DLL per line.
; Relative paths are relative to this file. ';' starts a comment.
; ExampleMod.dll
; somefolder\AnotherMod.dll
